<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   EcoEscambo - Análise de Oferta
  </title>
  <link href="../css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="browser">
   <header class="browser-title">
    EcoEscambo - Análise de Oferta
   </header>
   <div class="address">
    https://www.ecoescambo.com.br
   </div>
   <main class="page-content">
    <section class="offer-analysis">
     <h1>
      Meu produto
     </h1>
     <div class="main-product">
      <img alt="Meu produto" src="../assets/img/kitlivros.png"/>
      <div>
       <strong>
        Kit de livros
       </strong>
       <p>
        Conjunto de livros usados disponíveis para troca.
       </p>
      </div>
     </div>
     <div class="interested">
      <strong>
       Interessado
      </strong>
      <input readonly="" value="Fulano"/>
     </div>
     <h2>
      Oferece troca por
     </h2>
     <div class="swap">
      <img alt="Produto" src="../assets/img/vaso.png"/>
      <div>
       <strong>
        Vaso de plantas
       </strong>
       <p>
        Vaso de cerâmica reutilizado, perfeito para pequenas plantas.
       </p>
      </div>
     </div>
     <div class="actions offer-actions">
      <button class="btn green" id="acceptOfferButton" type="button">
       Aceitar
      </button>
      <button class="btn red" id="rejectOfferButton" type="button">
       Recusar
      </button>
     </div>
     <p class="success" id="result">
     </p>
     <p>
      <a href="ofertas-recebidas.html">
       Voltar para ofertas
      </a>
     </p>
    </section>
   </main>
  </div>
  <script src="../js/navigation.js">
  </script>
 </body>
</html>
