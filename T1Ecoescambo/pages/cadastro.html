<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   EcoEscambo - Cadastro Utilizador
  </title>
  <link href="../css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="browser">
   <header class="browser-title">
    EcoEscambo - Cadastro Utilizador
   </header>
   <div class="address">
    https://www.ecoescambo.com.br
   </div>
   <main class="page-content">
    <section class="form-box">
     <form id="registerForm">
      <label for="registerEmail">
       E-mail:
      </label>
      <input id="registerEmail" placeholder="fulano@email.com" required="" type="email"/>
      <label for="registerName">
       Nome:
      </label>
      <input id="registerName" placeholder="Fulano da Silva" required="" type="text"/>
      <label for="registerPassword">
       Senha:
      </label>
      <input id="registerPassword" required="" type="password"/>
      <label for="registerConfirm">
       Repita a Senha:
      </label>
      <input id="registerConfirm" required="" type="password"/>
      <p class="small-text">
       A senha deve ter pelo menos 6 caracteres, letras maiúsculas e minúsculas e números.
      </p>
      <button class="btn blue" disabled="" id="registerButton" type="submit">
       Cadastrar
      </button>
     </form>
     <p>
      <a href="login.html">
       Voltar
      </a>
     </p>
    </section>
   </main>
  </div>
  <script src="../js/validation.js">
  </script>
 </body>
</html>
